<ion-content class="login-content" [scroll]="false">
  
  <div class="login-wrapper">
    
    <!-- Back Button -->
    <button class="back-button" (click)="goBack()" aria-label="Go back">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <!-- Lottie Animation -->
    <div class="lottie-container">
      <div #lottieContainer class="lottie-animation"></div>
    </div>

    <!-- Welcome Section -->
    <div class="welcome-section">
      <h1 class="welcome-title">Welcome Back</h1>
      <p class="welcome-subtitle">Choose your account to continue</p>
    </div>

    <!-- Account Cards -->
    <div class="accounts-container">
      <div class="account-card" *ngFor="let identifier of savedIdentifiers" 
           (click)="selectIdentifier(identifier)">
        <div class="account-avatar">
          <div class="avatar-inner" [class.email]="isEmail(identifier)" [class.phone]="isPhone(identifier)">
            <ion-icon [name]="getIdentifierIcon(identifier)"></ion-icon>
          </div>
          <div class="account-badge" *ngIf="isEmail(identifier)">
            <ion-icon name="mail-outline"></ion-icon>
          </div>
        </div>
        <div class="account-details">
          <span class="account-name">{{ identifier }}</span>
          <span class="account-type">{{ isEmail(identifier) ? 'Email Account' : 'Phone Number' }}</span>
        </div>
        <div class="account-action">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </div>

      <!-- Add Account Card -->
      <div class="account-card add-account" (click)="addNewAccount()">
        <div class="account-avatar add-avatar">
          <ion-icon name="add-outline"></ion-icon>
        </div>
        <div class="account-details">
          <span class="account-name">Add New Account</span>
          <span class="account-type">Sign in with different email or phone</span>
        </div>
        <div class="account-action">
          <ion-icon name="chevron-forward-outline"></ion-icon>
        </div>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider-section">
      <span class="divider-line"></span>
      <span class="divider-text">or continue with</span>
      <span class="divider-line"></span>
    </div>

    <!-- Social Login -->
    <div class="social-section">
      <button class="social-btn google" (click)="loginWithGoogle()">
        <ion-icon name="logo-google"></ion-icon>
        <span>Google</span>
      </button>
      <button class="social-btn facebook" (click)="loginWithFacebook()">
        <ion-icon name="logo-facebook"></ion-icon>
        <span>Facebook</span>
      </button>
      <button class="social-btn apple" (click)="loginWithApple()">
        <ion-icon name="logo-apple"></ion-icon>
        <span>Apple</span>
      </button>
    </div>

    <!-- Footer -->
    <div class="footer-section">
      <p class="footer-text">
        Don't have an account? 
        <span class="footer-link" (click)="goToSignup()">Sign Up</span>
      </p>
    </div>

  </div>
</ion-content>
