<ion-content class="forgot-content" [scroll]="false">
  
  <!-- ==========================
  FORGOT PASSWORD FORM
  ========================== -->
  <div class="forgot-wrapper">
    
    <!-- Back Button -->
    <button class="back-button" (click)="goBack()" aria-label="Go back">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <!-- Icon -->
    <div class="forgot-icon">
      <div class="icon-wrapper">
        <ion-icon name="lock-closed-outline"></ion-icon>
      </div>
    </div>

    <!-- Welcome Text -->
    <div class="welcome-text">
      <h2>Forgot Password</h2>
      <p>Enter your email to reset your password</p>
    </div>

    <!-- Forgot Password Form -->
    <form class="forgot-form" (ngSubmit)="submit()" [formGroup]="form" novalidate>
      
      <!-- Email Field -->
      <div class="form-group">
        <div class="input-wrapper" [class.focused]="emailFocused">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <input 
            type="email" 
            class="form-input" 
            placeholder="Email Address"
            formControlName="email"
            (focus)="emailFocused = true"
            (blur)="emailFocused = false"
          />
        </div>
        <div class="error-message" *ngIf="isInvalid('email')">
          <span *ngIf="email?.errors?.['required']">Email is required</span>
          <span *ngIf="email?.errors?.['email']">Enter a valid email address</span>
        </div>
      </div>

      <!-- Success Message -->
      <div class="success-message" *ngIf="successMessage">
        <ion-icon name="checkmark-circle-outline"></ion-icon>
        <span>{{ successMessage }}</span>
      </div>

      <!-- Reset Button -->
      <button type="submit" class="btn-reset" [disabled]="isLoading">
        <span>{{ isLoading ? 'Sending...' : 'Send Reset Link' }}</span>
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </button>

    </form>

    <!-- Login Link -->
    <div class="login-link">
      <p>
        Remember your password? 
        <span class="login-btn" (click)="goToLogin()">Sign In</span>
      </p>
    </div>

  </div>
</ion-content>
