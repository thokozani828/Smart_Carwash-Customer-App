<ion-content class="chat-content" [scroll]="true">
  <div class="chat-container">
    
    <!-- Skeleton Loading -->
    <div *ngIf="isLoading" class="chat-skeleton">
      
      <!-- Header Skeleton -->
      <div class="skeleton-header">
        <div class="skeleton-flex">
          <div class="skeleton skeleton-circle" style="width:40px;height:40px;"></div>
          <div class="skeleton skeleton-text skeleton-w-40"></div>
          <div class="skeleton skeleton-circle" style="width:40px;height:40px;"></div>
        </div>
        <div class="skeleton skeleton-text-sm skeleton-w-30"></div>
      </div>

      <!-- Chat Messages Skeleton -->
      <div class="skeleton-chat-messages">
        <div class="skeleton skeleton-card" style="width:70%;height:50px;border-radius:12px;align-self:flex-start;"></div>
        <div class="skeleton skeleton-card" style="width:60%;height:40px;border-radius:12px;align-self:flex-start;margin-left:40px;"></div>
        <div class="skeleton skeleton-card" style="width:75%;height:55px;border-radius:12px;align-self:flex-end;"></div>
        <div class="skeleton skeleton-card" style="width:65%;height:45px;border-radius:12px;align-self:flex-end;margin-right:40px;"></div>
        <div class="skeleton skeleton-card" style="width:55%;height:35px;border-radius:12px;align-self:flex-start;"></div>
        <div class="skeleton skeleton-card" style="width:80%;height:60px;border-radius:12px;align-self:flex-end;"></div>
      </div>

      <!-- Input Skeleton -->
      <div class="skeleton-input-wrapper">
        <div class="skeleton skeleton-card" style="flex:1;height:48px;border-radius:12px;"></div>
        <div class="skeleton skeleton-circle" style="width:48px;height:48px;"></div>
      </div>

    </div>

    <!-- Actual Content (shown when not loading) -->
    <div *ngIf="!isLoading">
      
      <!-- Header -->
      <div class="chat-header">
        <div class="header-top">
          <div class="back-button" (click)="goBack()">
            <ion-icon name="arrow-back-outline"></ion-icon>
          </div>
          <div class="agent-info">
            <div class="agent-avatar">
              <img src="https://ui-avatars.com/api/?name=Support+Agent&background=2563eb&color=fff&size=40&bold=true" alt="Agent" />
              <span class="agent-status"></span>
            </div>
            <div class="agent-details">
              <span class="agent-name">Support Agent</span>
              <span class="agent-status-text">Online</span>
            </div>
          </div>
          <div class="header-actions">
            <button class="more-btn" (click)="showOptions()">
              <ion-icon name="ellipsis-vertical-outline"></ion-icon>
            </button>
          </div>
        </div>
      </div>

      <!-- Chat Messages -->
      <div class="chat-messages" #chatMessages>
        <div class="message-wrapper" *ngFor="let message of messages">
          <div class="message" [class.sent]="message.type === 'sent'" [class.received]="message.type === 'received'">
            <div class="message-bubble">
              <p class="message-text">{{ message.text }}</p>
              <span class="message-time">{{ message.time }}</span>
            </div>
            <div class="message-status" *ngIf="message.type === 'sent'">
              <ion-icon *ngIf="message.status === 'sent'" name="checkmark-outline"></ion-icon>
              <ion-icon *ngIf="message.status === 'delivered'" name="checkmark-done-outline"></ion-icon>
              <ion-icon *ngIf="message.status === 'read'" name="checkmark-done-outline" class="read"></ion-icon>
            </div>
          </div>
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" *ngIf="isTyping">
          <div class="typing-dots">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <span class="typing-text">Agent is typing...</span>
        </div>
      </div>

      <!-- Chat Input -->
      <div class="chat-input-wrapper">
        <div class="input-container">
          <button class="attach-btn" (click)="attachFile()">
            <ion-icon name="attach-outline"></ion-icon>
          </button>
          <input 
            type="text" 
            class="chat-input" 
            placeholder="Type your message..."
            [(ngModel)]="newMessage"
            (keyup.enter)="sendMessage()"
            #messageInput
          />
          <button class="emoji-btn" (click)="toggleEmoji()">
            <ion-icon name="happy-outline"></ion-icon>
          </button>
          <button class="send-btn" [class.active]="newMessage.trim().length > 0" (click)="sendMessage()">
            <ion-icon name="send-outline"></ion-icon>
          </button>
        </div>
      </div>

      <!-- Quick Replies -->
      <div class="quick-replies" *ngIf="showQuickReplies">
        <button class="quick-reply-btn" *ngFor="let reply of quickReplies" (click)="sendQuickReply(reply)">
          {{ reply }}
        </button>
      </div>

    </div>

    <!-- Bottom Spacer -->
    <div class="bottom-spacer"></div>

  </div>
</ion-content>
