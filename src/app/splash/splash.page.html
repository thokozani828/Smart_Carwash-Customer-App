<ion-content class="splash-content">
  <div class="splash-container">
    
    <!-- Animated Background -->
    <div class="animated-bg">
      <div class="glow glow-1"></div>
      <div class="glow glow-2"></div>
      <div class="glow glow-3"></div>
    </div>

    <!-- Broken Glass Effects -->
    <div class="glass-container">
      <div class="glass-shard shard-1"></div>
      <div class="glass-shard shard-2"></div>
      <div class="glass-shard shard-3"></div>
      <div class="glass-shard shard-4"></div>
      <div class="glass-shard shard-5"></div>
      <div class="glass-shard shard-6"></div>
      <div class="glass-shard shard-7"></div>
      <div class="glass-shard shard-8"></div>
      <div class="glass-shard shard-9"></div>
      <div class="glass-shard shard-10"></div>
      <div class="glass-shard shard-11"></div>
      <div class="glass-shard shard-12"></div>
    </div>

    <!-- Main Content -->
    <div class="splash-content-wrapper">
      
      <!-- Brand Section -->
      <div class="brand-section">
        <div class="brand-text">
          <h1 class="brand-name">
            <span class="smart">Smart</span>
            <span class="carwash">Carwash</span>
          </h1>
          <div class="brand-underline"></div>
          <p class="brand-tagline">Pull Up Dirty, Roll Out Clean</p>
        </div>
      </div>

    </div>
  </div>
</ion-content>
